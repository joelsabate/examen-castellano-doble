<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EFECTO VELA · Castellano Unidad 2</title><style>:root{font-family:system-ui,Arial;color:#152640;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:24px 16px}header{background:linear-gradient(110deg,#173d80,#347bd5);color:white;padding:28px;border-radius:18px}h1{margin:8px 0}h2{margin-top:0}.card{background:white;padding:24px;border-radius:16px;margin-top:18px;box-shadow:0 3px 16px #1c365315}.choices{display:grid;gap:10px}.choice{border:1px solid #cbd8e9;background:#fff;border-radius:10px;padding:13px;text-align:left;font:inherit;cursor:pointer}.choice.selected{border:2px solid #2367cc;background:#eaf2ff}.btn{border:0;border-radius:10px;background:#215fc3;color:white;padding:13px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e9eff8;color:#16345d}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#60718a}.pill{background:#e8f1ff;color:#1b56a7;padding:6px 12px;border-radius:30px;font-size:13px;font-weight:700}.correct{color:#18794e}.wrong{color:#bb3545}.review{padding:12px 0;border-bottom:1px solid #e5ebf3}.hidden{display:none}button:focus-visible{outline:3px solid orange}footer{font-size:13px;color:#60718a;margin:20px 0}</style></head><body><div class="wrap"><header><span class="pill">EFECTO VELA · 3.º DE PRIMARIA</span><h1>Castellano · Unidad 2</h1><p>Dos exámenes finales: fácil y difícil · 10 preguntas cada uno</p></header><main id="app"></main><footer>Práctica educativa basada en los contenidos de la Unidad 2. Las preguntas y lecturas son originales.</footer></div><script>
const exams=[{id:'facil',title:'Examen 1 · Fácil',description:'Repasa lo esencial de la unidad.',reading:'Lucía encontró un gatito en el jardín. Le puso agua limpia y avisó a su madre. Juntas llamaron a un refugio para que lo cuidaran.',qs:[
['Comprensión lectora','¿Dónde encontró Lucía al gatito?',['En el jardín','En la escuela','En el parque'],0,'El texto dice «en el jardín».'],
['Comprensión lectora','¿A quién avisó Lucía?',['A su vecino','A su madre','A su profesor'],1,'Lucía avisó a su madre.'],
['Correo electrónico','¿Qué parte del correo indica el tema del mensaje?',['Asunto','Para','Despedida'],0,'El asunto resume el tema del correo.'],
['Nota de voz','Una nota de voz es un mensaje…',['Que se escucha','Que siempre se escribe en papel','Que solo contiene dibujos'],0,'Las notas de voz son mensajes orales grabados.'],
['Ortografía','¿Cuál de estas palabras es aguda?',['caracol','carta','águila'],0,'ca-ra-COL: la sílaba tónica es la última.'],
['Ortografía','¿Cuál de estas palabras es esdrújula?',['papel','música','gato'],1,'MÚ-si-ca: la sílaba tónica es la antepenúltima.'],
['Léxico','¿Cuál es un sinónimo de «enorme»?',['pequeño','grande','estrecho'],1,'Enorme y grande tienen significados parecidos.'],
['Léxico','¿Cuál es el antónimo de «rápido»?',['veloz','ágil','lento'],2,'Rápido y lento tienen significados contrarios.'],
['Gramática','En «El perro duerme», ¿cuál es el sujeto?',['El perro','duerme','El'],0,'El sujeto es «El perro».'],
['Puntuación','¿Qué signo termina una oración enunciativa?',['Un punto','Una coma','Dos puntos'],0,'Una oración enunciativa suele terminar en punto.']
]},{id:'dificil',title:'Examen 2 · Difícil',description:'Piensa, relaciona y aplica lo aprendido.',reading:'El lunes, Mateo escribió un correo a la directora del refugio de animales. En el asunto puso «Visita de nuestra clase». Explicó que sus compañeros querían conocer cómo cuidaban a los perros y gatos. La directora respondió el martes y propuso una visita el viernes. Mateo grabó una nota de voz para informar a su clase.',qs:[
['Comprensión lectora','¿Por qué escribió Mateo al refugio?',['Para adoptar un gato','Para organizar una visita de clase','Para pedir comida'],1,'Quería saber cómo cuidaban a los animales y organizar una visita.'],
['Comprensión lectora','¿Qué sucedió después de la respuesta de la directora?',['Mateo grabó una nota de voz','Mateo escribió por primera vez','La clase fue el lunes'],0,'Después de recibir la respuesta, Mateo grabó una nota de voz.'],
['Correo electrónico','¿Cuál sería el mejor asunto para un correo que pide información sobre los horarios del refugio?',['Hola','Consulta sobre los horarios del refugio','Hasta pronto'],1,'El asunto debe resumir claramente el tema.'],
['Nota de voz','¿Qué nota de voz comunica mejor una información importante?',['«Eh… bueno… eso…»','«Hola, clase. Visitaremos el refugio el viernes. Recordad traer la autorización.»','«¡Qué bien! ¡Qué bien!»'],1,'Una buena nota de voz es clara, breve y concreta.'],
['Ortografía','¿Qué grupo está formado solo por palabras llanas?',['carta, perro, refugio','caracol, papel, jardín','música, águila, teléfono'],0,'CAR-ta, PE-rro y re-FU-gio son llanas.'],
['Ortografía','¿Cuál es la clasificación correcta de «teléfono»?',['Aguda','Llana','Esdrújula'],2,'te-LÉ-fo-no tiene la sílaba tónica en la antepenúltima posición.'],
['Léxico','En «La gata se escondió porque era tímida», ¿qué palabra puede sustituir a «tímida»?',['vergonzosa','valiente','ruidosa'],0,'Vergonzosa es un sinónimo adecuado en este contexto.'],
['Léxico','¿Qué palabra expresa lo contrario de «ancha»?',['amplia','estrecha','grande'],1,'Ancha y estrecha son antónimos.'],
['Gramática','En «Los alumnos del colegio visitaron el refugio», ¿cuál es el predicado?',['Los alumnos','del colegio','visitaron el refugio'],2,'El predicado explica qué hicieron los alumnos.'],
['Puntuación','¿Dónde corresponde un punto y aparte?',['Entre dos párrafos distintos','Entre el sujeto y el verbo','Después de cada palabra'],0,'El punto y aparte separa párrafos.']
]}];
let active=null,answers=[],pos=0,finished=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function home(){active=null;app.innerHTML='<section class="card"><h2>Elige un examen</h2><p class="muted">Cada examen tiene 10 preguntas. Al finalizar, verás tu nota, los errores y las respuestas correctas.</p>'+exams.map((e,i)=>`<div class="card"><div class="row"><div><span class="pill">${i===0?'NIVEL FÁCIL':'NIVEL DIFÍCIL'}</span><h2>${e.title}</h2><p class="muted">${e.description}</p></div><button class="btn" onclick="start(${i})">Empezar</button></div></div>`).join('')+'</section>'}function start(i){active=exams[i];answers=Array(10).fill(null);pos=0;finished=false;show()}function show(){const q=active.qs[pos];app.innerHTML=`<section class="card"><div class="row"><span class="pill">${esc(active.title)}</span><span class="muted">Pregunta ${pos+1} de 10</span></div><div style="height:8px;background:#e6edf8;border-radius:8px;margin:18px 0"><div style="height:100%;width:${(pos+1)*10}%;background:#347bd5;border-radius:8px"></div></div>${pos<2?`<div class="card" style="background:#f5f8fe"><strong>Lee este texto:</strong><p>${esc(active.reading)}</p></div>`:''}<p class="muted">${esc(q[0])}</p><h2>${esc(q[1])}</h2><div class="choices">${q[2].map((a,i)=>`<button class="choice ${answers[pos]===i?'selected':''}" onclick="pick(${i})">${'ABC'[i]}. ${esc(a)}</button>`).join('')}</div><div class="row" style="margin-top:24px"><button class="btn secondary" onclick="${pos?'prev()':'home()'}">${pos?'Anterior':'Volver al inicio'}</button><button class="btn" ${answers[pos]===null?'disabled':''} onclick="next()">${pos===9?'Corregir examen':'Siguiente'}</button></div></section>`}function pick(i){answers[pos]=i;show()}function prev(){pos--;show()}function next(){if(answers[pos]===null)return;if(pos<9){pos++;show()}else result()}function result(){const score=active.qs.reduce((s,q,i)=>s+(answers[i]===q[3]),0);let history=[];try{history=JSON.parse(localStorage.getItem('vela_castellano_u2_scores')||'[]')}catch(e){}history.push({exam:active.id,score,date:new Date().toISOString()});try{localStorage.setItem('vela_castellano_u2_scores',JSON.stringify(history.slice(-30)))}catch(e){}app.innerHTML=`<section class="card"><span class="pill">EXAMEN CORREGIDO</span><h2>${esc(active.title)}</h2><h1 style="font-size:48px">${score} / 10</h1><p>${score>=9?'¡Excelente trabajo!':score>=7?'¡Muy bien! Revisa los errores.':score>=5?'¡Buen esfuerzo! Sigue practicando.':'Repasa las soluciones y vuelve a intentarlo.'}</p><div class="row"><button class="btn" onclick="start(${exams.indexOf(active)})">Repetir examen</button><button class="btn secondary" onclick="home()">Elegir otro examen</button></div><h2 style="margin-top:30px">Corrección y explicaciones</h2>${active.qs.map((q,i)=>`<div class="review"><strong>${i+1}. ${esc(q[1])}</strong><p class="${answers[i]===q[3]?'correct':'wrong'}">${answers[i]===q[3]?'✓ Correcto':'✗ Incorrecto'} · Tu respuesta: ${esc(q[2][answers[i]])}</p><p><strong>Respuesta correcta:</strong> ${esc(q[2][q[3]])}</p><p class="muted">${esc(q[4])}</p></div>`).join('')}</section>`}home();
</script></body></html>
